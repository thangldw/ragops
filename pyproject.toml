[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ragops"
version = "2.6.0"
description = "Regression tests and explainable release gates for RAG and AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Thang Luu" }]
keywords = ["rag", "evaluation", "ai-agents", "release-gates", "regression-testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/thangldw/ragops"
Documentation = "https://github.com/thangldw/ragops#readme"
Issues = "https://github.com/thangldw/ragops/issues"
Changelog = "https://github.com/thangldw/ragops/blob/main/CHANGELOG.md"

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8.0", "coverage>=7.6", "mypy>=1.11", "hypothesis>=6.100", "ruff>=0.6", "fastapi>=0.115", "httpx>=0.27", "jsonschema>=4.23"]
mutation = ["mutmut>=3.3"]
release = ["build>=1.2", "cyclonedx-bom>=7.3", "twine>=5.1"]

[project.scripts]
ragops = "ragops.cli:cli_entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/ragops"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "ragops/schemas"
"src/ragops/web/index.html" = "ragops/web/index.html"
"src/ragops/web/app.js" = "ragops/web/app.js"
"src/ragops/web/styles.css" = "ragops/web/styles.css"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-p no:pytest_playwright"

[tool.ruff]
extend-exclude = ["mutants"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src/ragops"]

[tool.coverage.report]
fail_under = 91
show_missing = true
skip_empty = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src/ragops"]

# Run: pip install -e ".[mutation]" && PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 mutmut run && mutmut results; delete ./mutants afterwards.
[tool.mutmut]
paths_to_mutate = ["src/ragops/calibration.py", "src/ragops/explain.py", "src/ragops/policy_suggest.py", "src/ragops/ci.py", "src/ragops/policy_v2.py", "src/ragops/counterfactual.py", "src/ragops/triage.py", "src/ragops/stability.py", "src/ragops/mine.py"]
tests_dir = ["tests/test_calibration.py", "tests/test_explain_ci.py", "tests/test_policy_suggest.py", "tests/test_calibration_boundaries.py", "tests/test_ci_render_exact.py", "tests/test_calibration_loader_errors.py", "tests/test_policy_v2.py", "tests/test_policy_v2_mutations.py", "tests/test_policy_validation.py", "tests/test_slice_distribution.py", "tests/test_policy_v2_gate_semantics.py", "tests/test_counterfactual.py", "tests/test_triage.py", "tests/test_stability.py", "tests/test_mine.py"]
also_copy = ["src", "examples", "apps", "scenarios", "schemas", "pyproject.toml", "ragops.toml", "README.md", "scripts", "action.yml", ".github"]
pytest_add_cli_args = ["-p", "no:cacheprovider"]
