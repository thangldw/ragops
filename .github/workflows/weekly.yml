name: Weekly benchmark

# Scheduled drift check: unlike ci.yml it runs against the newest dependency releases, so a
# breaking upstream change or a grounding-accuracy regression shows up within a week even
# when no pull request is open.
on:
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install with the newest dependencies
        run: python -m pip install --disable-pip-version-check --upgrade -e '.[dev]'
      - name: Test
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest -q
      - name: Grounding benchmark
        run: |
          python scripts/grounding_benchmark.py | tee benchmark.json
          {
            echo "## Grounding benchmark"
            echo
            echo '```json'
            cat benchmark.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
